[project]
name = "docmind"
version = "0.1.0"
description = "Hybrid semantic document chunking and indexing pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sourav Bhattacharya", email = "bhsourav17@gmail.com" },
]

dependencies = [
    "python-dotenv",
    "openai",
    "langchain-openai",
    "langchain-community",
    "langchain-experimental",
    "pypdf",
    "pinecone",
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["upload_api/tests"]
