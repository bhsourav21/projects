[project]
name = "researchbot"
version = "0.1.0"
description = "Autonomous research agent built with LangGraph, Tavily and Pinecone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sourav Bhattacharya", email = "bhsourav17@gmail.com" },
]

dependencies = [
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "pinecone>=10.2.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tavily-python>=0.8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
